name: Java checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify
  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: bugtrack-ci
      DB_PASSWORD: bugtrack-ci-database
      DEMO_ENABLED: 'true'
      DEMO_PASSWORD: BugtrackDemo2026!
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: python3 scripts/docker-smoke.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
