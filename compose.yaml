services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-bugtrack}
      POSTGRES_USER: ${DB_USERNAME:-bugtrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bugtrack-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  bugtrack-db:
