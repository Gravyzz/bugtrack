services:
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-bugtrack}
      DB_USERNAME: ${DB_USERNAME:-bugtrack}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://localhost:8080/"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 12
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-bugtrack}
      POSTGRES_USER: ${DB_USERNAME:-bugtrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - bugtrack-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
volumes:
  bugtrack-db:
